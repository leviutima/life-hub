services:
  postgres:
    image: postgres:18-alpine
    container_name: lifehub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lifehub
      POSTGRES_PASSWORD: lifehub
      POSTGRES_DB: lifehub
    ports:
      - '5432:5432'
    volumes:
      # Postgres 18+: o mount vai em /var/lib/postgresql (ele cria data/ com a versao dentro)
      - lifehub-pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lifehub -d lifehub']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lifehub-pgdata:
